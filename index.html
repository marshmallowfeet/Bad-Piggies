<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#000000">
  <title>Unity WebGL Player | Bad Piggies</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    :root{
      --brand:#5ee1ff;
      --glow:0 0 12px rgba(94,225,255,.65), 0 0 32px rgba(155,255,183,.35);
      --shadow:0 10px 30px rgba(0,0,0,.4);
    }

    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:#000;
      color:#eaf4ff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow:hidden;
    }

    body{
      position:relative;
      background:#000;
    }

    .webgl-content{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      background:#000;
      overflow:hidden;
    }

    #gameShell{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }

    #gameContainer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
    }

    #gameContainer canvas{
      position:absolute !important;
      left:50% !important;
      top:50% !important;
      transform:translate(-50%, -50%) !important;
      transform-origin:center center !important;
      margin:0 !important;
      display:block !important;
    }

    #gameContainer .logo,
    #gameContainer .logo.Dark{
      background-image:url("TemplateData/progressLogo.Dark.png") !important;
      background-repeat:no-repeat !important;
      background-position:center center !important;
      background-size:contain !important;
    }

    .seo-hidden{
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(1px,1px,1px,1px);
      white-space:nowrap;
    }
  </style>

  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
</head>
<body style="background-color:black;">

  <div class="webgl-content">
    <div id="gameShell">
      <div id="gameContainer"></div>
    </div>
  </div>

  <div class="seo-hidden" aria-hidden="true">
    <h1>Bad Piggies unblocked game</h1>
    <p>Play Bad Piggies in your browser using a local Unity WebGL build with fullscreen support.</p>
  </div>

  <script>
    window.onbeforeunload = function () {
      return "Are you sure you want to leave? Your session may be interrupted.";
    };

    function replaceBadProgressLogo() {
      var badUrl = "https://cdn.jsdelivr.net/gh/67-Factory/web-ports@main/badpiggies/TemplateData/progressLogo.Dark.png";
      var goodUrl = "TemplateData/progressLogo.Dark.png";

      var imgs = document.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) {
        var src = imgs[i].getAttribute("src") || "";
        if (src.indexOf(badUrl) !== -1) {
          imgs[i].setAttribute("src", goodUrl);
        }
      }

      var nodes = document.querySelectorAll("*");
      for (var j = 0; j < nodes.length; j++) {
        var bg = window.getComputedStyle(nodes[j]).backgroundImage || "";
        if (bg.indexOf(badUrl) !== -1) {
          nodes[j].style.backgroundImage = 'url("TemplateData/progressLogo.Dark.png")';
        }
      }
    }

    function fitUnityCanvas() {
      var container = document.getElementById("gameContainer");
      if (!container) return;

      var canvas = container.querySelector("canvas");
      if (!canvas) return;

      var baseWidth = parseInt(canvas.getAttribute("width"), 10) || canvas.width || 960;
      var baseHeight = parseInt(canvas.getAttribute("height"), 10) || canvas.height || 600;

      var screenWidth = window.innerWidth;
      var screenHeight = window.innerHeight;

      var scale = Math.min(screenWidth / baseWidth, screenHeight / baseHeight);
      var renderWidth = Math.round(baseWidth * scale);
      var renderHeight = Math.round(baseHeight * scale);

      canvas.style.width = renderWidth + "px";
      canvas.style.height = renderHeight + "px";
      canvas.style.left = "50%";
      canvas.style.top = "50%";
      canvas.style.transform = "translate(-50%, -50%)";
      canvas.style.position = "absolute";
      canvas.style.margin = "0";
      canvas.style.display = "block";
    }

    function watchUnityElements() {
      var container = document.getElementById("gameContainer");
      if (!container) return;

      var observer = new MutationObserver(function () {
        replaceBadProgressLogo();
        fitUnityCanvas();
      });

      observer.observe(container, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["style", "src", "class"]
      });

      setInterval(function () {
        replaceBadProgressLogo();
        fitUnityCanvas();
      }, 250);
    }

    watchUnityElements();
    window.addEventListener("resize", fitUnityCanvas);

    window.gameInstance = UnityLoader.instantiate("gameContainer", "Build/Bad Piggies.json", {
      onProgress: UnityProgress
    });
  </script>
</body>
</html>
